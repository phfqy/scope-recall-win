name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore scope-recall-win.csproj -p:Platform=${{ matrix.platform }}

      - name: Build (Release)
        run: dotnet build scope-recall-win.csproj -p:Platform=${{ matrix.platform }} -c Release --no-restore

      - name: Static verification
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python verify_static.py

  package:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish unpackaged (self-contained, x64)
        run: >
          dotnet publish scope-recall-win.csproj -p:Platform=x64 -c Release -r win-x64
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -o installer/publish/run

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build setup exe
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc installer\setup.iss

      - name: Upload setup exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe-x64
          path: installer/out/ScopeRecallWin-Setup-1.0.0.exe
          if-no-files-found: error
